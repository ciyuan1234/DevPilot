name: CI

on:
  push:
  pull_request:

jobs:
  backend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libdrogon-dev

      - name: Configure
        run: cmake -S backend -B backend/build

      - name: Build
        run: cmake --build backend/build

      - name: Smoke test (health check)
        run: bash scripts/smoke-test.sh
